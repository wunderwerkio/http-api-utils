name: Lint & Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint_test:
    name: Lint & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        reqs:
          - symfony: "^5"
            php: "8.1"
          - symfony: "^5"
            php: "8.2"
          - symfony: "^5"
            php: "8.3"
          - symfony: "^6"
            php: "8.1"
          - symfony: "^6"
            php: "8.2"
          - symfony: "^6"
            php: "8.3"
          - symfony: "^7"
            php: "8.2"
          - symfony: "^7"
            php: "8.3"
          - symfony: "^6"
            php: "8.4"
          - symfony: "^7"
            php: "8.4"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.reqs.php }}
          tools: composer
          coverage: none
        env:
          runner: "blacksmith"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.reqs.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.reqs.php }}-

      - name: Install dependencies
        run: >-
          composer update --no-ansi --no-interaction --no-progress &&
          composer require symfony/http-foundation:${{ matrix.reqs.symfony }}

      - name: PHPCS
        run: ./vendor/bin/phpcs -s src tests

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --level 8 src tests

      - name: PHPUnit
        run: ./vendor/bin/phpunit tests
